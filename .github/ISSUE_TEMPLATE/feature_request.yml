name: Feature request
description: Propose a change of course.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SturtBar is deliberately narrow: one provider, zero third-party dependencies, nothing leaves your Mac. Requests that fit that shape have the best odds; requests that widen it will be weighed against it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that SturtBar does not do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you have worked around it, or other shapes the feature could take.
