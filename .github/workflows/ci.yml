name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          if [[ "${version%%.*}" != "27" ]]; then
            echo "::error::Expected Xcode 27, found ${version}"
            exit 1
          fi
          swift --version

      - name: Lint
        run: ./Scripts/lint.sh lint

      - name: Build
        run: swift build

      - name: Test
        run: swift test
