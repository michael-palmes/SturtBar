name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              break
            fi
          done
          swift --version

      - name: Lint
        run: ./Scripts/lint.sh lint

      - name: Build
        run: swift build

      - name: Test
        run: swift test
